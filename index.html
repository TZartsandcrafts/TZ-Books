<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let db=null,A=[],B=[],mem={authors:[],books:[],n:1};
function open(){return new Promise(r=>{try{const q=indexedDB.open("booktracker",1);q.onupgradeneeded=()=>{q.result.createObjectStore("authors",{keyPath:"id",autoIncrement:true});q.result.createObjectStore("books",{keyPath:"id",autoIncrement:true})};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function all(s){return new Promise(r=>{if(!db)return r(mem[s].slice());const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}
function put(s,o){return new Promise(r=>{if(!db){if(!o.id)o.id=mem.n++;mem[s]=mem[s].filter(x=>x.id!==o.id).concat([o]);return r(o)}const q=db.transaction(s,"readwrite").objectStore(s).put(o);q.onsuccess=()=>{o.id=q.result;r(o)};q.onerror=()=>r(o)})}
function del(s,id){return new Promise(r=>{if(!db){mem[s]=mem[s].filter(x=>x.id!==id);return r()}const q=db.transaction(s,"readwrite").objectStore(s).delete(id);q.onsuccess=q.onerror=()=>r()})}
async function load(){A=await all("authors");B=await all("books");for(const b of B){if(b.status==="创作中"){b.status="已宣布";await put("books",b)}}}
/* 封面：压缩后存 IndexedDB（bookmemo_photodb），书目记录的 cover 字段只存引用：'' 无封面 / 'photo:<id>' 本机图片 / 其他为远程地址 */
const PH={_db:null,db(){if(this._db)return Promise.resolve(this._db);return new Promise((ok,no)=>{const q=indexedDB.open("bookmemo_photodb",1);q.onupgradeneeded=()=>q.result.createObjectStore("photos");q.onsuccess=()=>{this._db=q.result;ok(q.result)};q.onerror=()=>no(q.error)})},
get(id){return this.db().then(db=>new Promise(ok=>{const q=db.transaction("photos").objectStore("photos").get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})).catch(()=>null)},
put(id,v){return this.db().then(db=>new Promise((ok,no)=>{const q=db.transaction("photos","readwrite").objectStore("photos").put(v,id);q.onsuccess=()=>ok(id);q.onerror=()=>no(q.error)}))},
del(id){return this.db().then(db=>new Promise(ok=>{const q=db.transaction("photos","readwrite").objectStore("photos").delete(id);q.onsuccess=q.onerror=()=>ok()})).catch(()=>{})},
isRef:s=>!!s&&String(s).indexOf("photo:")===0};
const pcache={};
async function saveCover(data){const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);await PH.put(id,data);pcache[id]=data;return "photo:"+id}
function delCover(ref){if(PH.isRef(ref)){const id=ref.slice(6);delete pcache[id];PH.del(id)}}
function coverImg(ref){if(!ref)return "";if(PH.isRef(ref)){const id=ref.slice(6);return pcache[id]?`<img alt="" onload="this.parentNode.classList.add('ld')" src="${esc(pcache[id])}">`:`<img alt="" onload="this.parentNode.classList.add('ld')" data-pref="${esc(ref)}">`}return `<img alt="" onload="this.parentNode.classList.add('ld')" src="${esc(ref)}">`}
function hydrate(){document.querySelectorAll("img[data-pref]").forEach(img=>{const id=img.dataset.pref.slice(6);if(pcache[id]){img.src=pcache[id];img.removeAttribute("data-pref");return}PH.get(id).then(d=>{if(d){pcache[id]=d;img.src=d;img.removeAttribute("data-pref")}})})}
function shrink(file,maxDim,q){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=e=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxDim/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);ok(c.toDataURL("image/jpeg",q))};im.onerror=()=>no(new Error("decode"));im.src=e.target.result};fr.onerror=()=>no(new Error("read"));fr.readAsDataURL(file)})}
async function prepCover(file){let m=900,q=.72,d=await shrink(file,m,q),n=0;while(d.length>180*1024&&n<5){m=Math.round(m*.8);q=Math.max(.4,q-.1);d=await shrink(file,m,q);n++}return d.length>260*1024?null:d}
const inlineCovers=l=>Promise.all(l.map(async b=>{if(!PH.isRef(b.cover))return b;const d=await PH.get(b.cover.slice(6));return {...b,cover:d||""}}));
async function migrateCover(b){const c=b.cover||"";if(c.indexOf("data:")===0)return {...b,cover:await saveCover(c)};if(PH.isRef(c))return {...b,cover:""};return b}
function dropCover(r){if(r.d&&r.d.cover&&r.d.cover!==r.orig)delCover(r.d.cover)}
function stageOld(r,old){if(!old)return;if(old===r.orig)r.del.push(old);else delCover(old)}
const VER="0.18.0";let S={worker:"https://bookmemo.taizaibook.workers.dev",sort:"字母",remind:"开",level:"中",scope:"全部",last:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("bookmemo_s")||"{}"))}catch(e){}
if(S.sort==="作品数")S.sort="实体书数";
const saveS=()=>{try{localStorage.setItem("bookmemo_s",JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const ld=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
const LV={"轻":1,"中":2,"强":3};function lvOf(b){return LV[b.level]?b.level:S.level}const lvn=b=>LV[lvOf(b)]||2;
function unbought(){if(S.remind!=="开")return[];return B.filter(b=>!pend(b)&&(b.purchased||"未购")==="未购"&&(S.scope==="全部"||au(b.authorId).remind==="开"))}
function soon(b){const m=String(b.expected||"").match(/(\d{4})\D{0,2}(\d{1,2})?/);if(!m)return false;const n=new Date();return new Date(+m[1],(m[2]||12)-1,1)<=new Date(n.getFullYear(),n.getMonth()+2,1)}
function due(){return S.remind==="开"?B.filter(b=>pend(b)&&soon(b)&&au(b.authorId).remind==="开"):[]}
const remU=n=>unbought().filter(b=>lvn(b)>=n),remD=n=>due().filter(b=>lvn(b)>=n);
const same=(a,b)=>a.authorId===b.authorId&&((a.isbn&&b.isbn)?a.isbn===b.isbn:(a.title===b.title&&(a.publisher||"")===(b.publisher||"")&&(a.date||a.expected||"")===(b.date||b.expected||"")));
let updNew="";
async function checkUpdate(manual){try{const t=await (await fetch(location.pathname,{cache:"reload"})).text(),m=t.match(/const VER="([\d.]+)"/);if(m&&m[1]!==VER){updNew=m[1];if(cur().p==="home"||cur().p==="settings")render();if(manual)toast("发现新版本 v"+m[1])}else if(manual)toast("已是最新版本 v"+VER)}catch(e){if(manual)toast("检查更新失败："+e.message)}}
async function addItem(r,x){if(!x.added&&B.some(b=>same(b,{authorId:r.id,isbn:x.isbn,title:x.title,publisher:x.publisher,date:x.date})))x.added=1;if(x.added)return;const p=x.status!=="已出版";await put("books",{authorId:r.id,title:x.title,publisher:x.publisher,isbn:x.isbn,script:x.script,status:x.status,date:p?"":x.date,expected:p?x.date:"",purchased:"未购",genre:"",workTitle:"",url:x.url});x.added=1}
async function doLookup(r){const a=au(r.id),names=[a.name,...pensOf(a)].filter(Boolean),k=S.gkey?"&key="+S.gkey:"",seen=new Set(),out=[],g={raw:0,na:[],dup:[]};let twErr="";
try{if(!names.length)throw new Error("作者没有本名或笔名");if(S.worker)for(const n of names){try{const res=await fetch(S.worker+"/isbntw?q="+encodeURIComponent(n));const j=await res.json();if(!res.ok||j.error)throw new Error(j.error||"HTTP "+res.status);for(const i of j.items||[]){const k="tw:"+i.title;if(seen.has(k))continue;seen.add(k);out.push({title:i.title,publisher:i.publisher,isbn:"",date:i.date,script:"繁体",src:"台湾国图",status:i.date>today().slice(0,7)?"已宣布":"已出版",url:"",added:B.some(b=>same(b,{authorId:r.id,isbn:"",title:i.title,publisher:i.publisher,date:i.date}))})}}catch(e){twErr=e.message}}
for(const n of names){const res=await fetch(`https://www.googleapis.com/books/v1/volumes?q=inauthor:%22${encodeURIComponent(n)}%22&printType=books&maxResults=40&langRestrict=zh${k}`);if(!res.ok)throw new Error("HTTP "+res.status);const j=await res.json();for(const i of j.items||[]){g.raw++;const v=i.volumeInfo||{};if(!v.title||!(v.authors||[]).some(x=>x.includes(n))){if(v.title)g.na.push(v.title+"〔"+(v.authors||[]).join("/")+"〕");continue}const isbn=((v.industryIdentifiers||[]).find(z=>z.type==="ISBN_13")||{}).identifier||"",key=isbn||v.title;if(seen.has(key)){g.dup.push(v.title);continue}seen.add(key);const d=v.publishedDate||"";const tt=v.title+(v.subtitle?"："+v.subtitle:"");out.push({title:tt,publisher:v.publisher||"",isbn,date:d,script:/^978(957|986|626|962|988)/.test(isbn)?"繁体":"简体",status:d>today().slice(0,d.length)?"已宣布":"已出版",url:v.infoLink||"",added:B.some(b=>same(b,{authorId:r.id,isbn,title:tt,publisher:v.publisher||"",date:d}))})}}
r.items=out.sort((x,y)=>y.date.localeCompare(x.date))}catch(e){r.items=out;r.err="Google Books 查询失败（"+e.message+"）。若为 HTTP 429/403，请在设置里填 Google Books API Key；网络不通时可能需要代理。"}

document.addEventListener("change",e=>{const t=e.target,r=cur();if(!t.dataset||!r.d)return;if(t.dataset.sm){r.sm=t.value;if(t.value==="auto"){r.d.setName="";r.d.noSet=false}else if(t.value==="none"){r.d.setName="";r.d.noSet=true}else r.d.noSet=false;render();return}if(t.dataset.f&&(t.type==="date"||t.type==="month")){r.d[t.dataset.f]=t.value;const p=t.parentNode,a=p.previousElementSibling&&p.previousElementSibling.querySelector(".clr"),h=p.nextElementSibling;if(a)a.style.display=t.value?"":"none";if(h&&h.classList.contains("hint")&&t.value)h.remove();return}if(t.dataset.pm){(r.pm=r.pm||{})[t.dataset.pm]=t.value;const v=r.d[t.dataset.pm]||"";if(t.value==="month"&&/^\d{4}-\d{2}-\d{2}$/.test(v))r.d[t.dataset.pm]=v.slice(0,7);render();return}if(t.dataset.s){r.d[t.dataset.s]=t.value;if(t.dataset.s==="purchased"){if(t.value==="未购")r.d.purchaseDate="";else if(!r.d.purchaseDate)r.d.purchaseDate=ld();render()}else if(t.dataset.s==="status"||t.dataset.s==="currency"||t.dataset.s==="listCurrency")render()}else if(t.dataset.sug&&t.value){r.d[t.dataset.sug]=t.value;render()}});
document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||!t.dataset.cover)return;const file=t.files&&t.files[0];if(!file)return;const r=cur(),st=document.getElementById("cvst");if(st)st.textContent="处理中…";
try{const data=await prepCover(file);if(!data){t.value="";if(st)st.textContent="";return toast("图片过大，请换一张")}
const ref=await saveCover(data);
if(t.dataset.cover==="edit"){stageOld(r,r.d.cover);r.d.cover=ref;render()}
else{const b=bk(r.id);if(!b){delCover(ref);return}const old=b.cover;b.cover=ref;await put("books",b);if(old)delCover(old);const y=scrollY;render();scrollTo(0,y);toast("封面已更新")}}
catch(x){t.value="";if(st)st.textContent="";toast("封面处理失败")}});
document.getElementById("imp").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;let j;try{j=JSON.parse(await f.text());if(!Array.isArray(j.authors)||!Array.isArray(j.books))throw 0}catch(x){return toast("文件无法识别")}ask("导入将覆盖当前全部数据，确定？",async()=>{for(const a of A)await del("authors",a.id);for(const b of B){delCover(b.cover);await del("books",b.id)}for(const a of j.authors)await put("authors",a);for(const b of j.books){const nb=await migrateCover(b);if(nb.status==="创作中")nb.status="已宣布";await put("books",nb)}if(j.settings){Object.assign(S,j.settings);if(S.sort==="作品数")S.sort="实体书数";saveS()}await load();{const i=stack.map(x=>x.p).lastIndexOf("settings");stack=stack.slice(0,i+1).filter(x=>["home","authors","books","settings"].includes(x.p));if(!stack.length||cur().p!=="settings")stack.push({p:"settings"})}render();toast("导入完成")})});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("sw register failed",e)))}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!e.target.closest("input,textarea"))back()});
let sx=0,sy=0,sk=1;document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;sk=!e.target.closest("input,textarea,select")},{passive:true});
document.addEventListener("touchend",e=>{const t=e.changedTouches[0];if(sk&&t.clientX-sx>90&&Math.abs(t.clientY-sy)<60)back()},{passive:true});
/* 长按（电脑端右键）书籍条目 → 弹出「复制此条目」，点击后以该条目的全部内容打开编辑页，保存即为新条目 */
const pop=document.createElement("div");pop.id="pop";pop.innerHTML='<button data-act="copyb">复制此条目</button>';document.body.appendChild(pop);
let lpTimer=null,lpId=null,lpFired=false,lpX=0,lpY=0;
function hidePop(){pop.style.display="none";lpId=null}
function showPop(id,x,y,touch){lpId=id;lpFired=!!touch;pop.style.display="block";const w=pop.offsetWidth,h=pop.offsetHeight;pop.style.left=Math.max(10,Math.min(innerWidth-w-10,x-w/2))+"px";pop.style.top=Math.max(10,y-h-26)+"px"}
async function copyBook(id){const b=bk(id);if(!b)return;const d={...b};delete d.id;if(PH.isRef(b.cover)){const data=await PH.get(b.cover.slice(6));d.cover=data?await saveCover(data):""}go({p:"edit",d,orig:"",del:[],copy:1});toast("已复制，修改后保存即为新条目")}
const bcard=t=>t.closest&&t.closest('.card.bc[data-go="book"]');
document.addEventListener("touchstart",e=>{lpFired=false;clearTimeout(lpTimer);lpTimer=null;const c=bcard(e.target);if(!c||!e.touches||e.touches.length!==1)return;lpX=e.touches[0].clientX;lpY=e.touches[0].clientY;lpTimer=setTimeout(()=>{lpTimer=null;showPop(+c.dataset.id,lpX,lpY,true);if(navigator.vibrate)navigator.vibrate(10)},550)},{capture:true,passive:true});
document.addEventListener("touchmove",e=>{if(lpTimer){const t=e.touches[0];if(Math.abs(t.clientX-lpX)>10||Math.abs(t.clientY-lpY)>10){clearTimeout(lpTimer);lpTimer=null}}},{passive:true});
["touchend","touchcancel"].forEach(n=>document.addEventListener(n,()=>{clearTimeout(lpTimer);lpTimer=null},{passive:true}));
document.addEventListener("contextmenu",e=>{const c=bcard(e.target);if(c){e.preventDefault();showPop(+c.dataset.id,e.clientX,e.clientY)}});
document.addEventListener("scroll",()=>{if(pop.style.display==="block")hidePop()},{passive:true});
document.addEventListener("click",e=>{if(lpFired){lpFired=false;e.stopPropagation();e.preventDefault();return}if(pop.style.display==="block"&&!e.target.closest("#pop")){hidePop();e.stopPropagation();e.preventDefault()}},true);
open().then(load).then(()=>{render();if((remU(3).length||remD(3).length)&&S.last!==today()){S.last=today();saveS();go({p:"remind"})}});
